<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Tree/Branch symbol -->
  <g transform="translate(100, 100)">
    <!-- Trunk -->
    <rect x="-8" y="20" width="16" height="40" fill="#0284c7" rx="2"/>
    
    <!-- Main branch -->
    <path d="M0,20 Q-15,0 -30,-15" stroke="url(#treeGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Left branches -->
    <path d="M-15,10 Q-35,-5 -45,-20" stroke="url(#treeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-25,0 Q-40,-15 -50,-30" stroke="url(#treeGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Right branches -->
    <path d="M15,10 Q35,-5 45,-20" stroke="url(#treeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25,0 Q40,-15 50,-30" stroke="url(#treeGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <circle cx="-30" cy="-15" r="6" fill="#0ea5e9"/>
    <circle cx="-45" cy="-20" r="5" fill="#38bdf8"/>
    <circle cx="-50" cy="-30" r="4" fill="#7dd3fc"/>
    <circle cx="30" cy="-15" r="6" fill="#0ea5e9"/>
    <circle cx="45" cy="-20" r="5" fill="#38bdf8"/>
    <circle cx="50" cy="-30" r="4" fill="#7dd3fc"/>
    
    <!-- Heart pulse line (medical symbol) -->
    <path d="M-20,50 L-10,50 L-5,40 L5,60 L10,50 L20,50" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- SaccArbor text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0284c7">SaccArbor</text>
</svg>
